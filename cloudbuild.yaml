steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/hellskitchenwine:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/hellskitchenwine:latest'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/hellskitchenwine:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/hellskitchenwine:latest']

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'run'
      - 'deploy'
      - 'hellskitchenwine'
      - '--image'
      - 'gcr.io/$PROJECT_ID/hellskitchenwine:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'VITE_SUPABASE_URL=${_VITE_SUPABASE_URL},VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}'

images:
  - 'gcr.io/$PROJECT_ID/hellskitchenwine:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/hellskitchenwine:latest'

options:
  logging: CLOUD_LOGGING_ONLY
